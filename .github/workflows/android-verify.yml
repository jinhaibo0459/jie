# 杰汇编 · AN 线（Android）运行级验证——GitHub Actions 配置
# -------------------------------------------------------------
# 在 GitHub 云端 arm64 Linux 机器上启动 Redroid（容器化 Android·arm64 原生·
# 无需 KVM/HVF——共享宿主内核），推入并运行 AN-1 冒烟样本（aarch64 静态 ELF·
# 直接 syscall）并核对输出（脚本：an/check.sh）。
# 判据：样本 md5 冻结值（防假绿）＋设备 ABI ＋三样本输出 ＋ rc=0。
#
# ★runner 选型（S3-C-144 联调 #1 教训·2026-10-15）：
#   ①macOS arm64 runner（macos-15）＝ M1/M2 无嵌套虚拟化 ⇒ 模拟器 HVF 失败
#     （HV_UNSUPPORTED·actions/runner-images#9472 定论）——已实测排除。
#   ②ubuntu-24.04-arm 不暴露 /dev/kvm ⇒ 模拟器无硬件加速。
#   ③⇒ 采用 ubuntu-24.04-arm ＋ Redroid 容器（arm64 Android 原生运行·
#     无虚拟化依赖）——「Android 用户态 + arm64 原生」实证（β 段先导）。
name: android-verify（AN线运行级）

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-verify.yml'
      - 'an/**'
  workflow_dispatch:

jobs:
  run-samples:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 生成冒烟样本并核验冻结 md5（防假绿）
        run: |
          python3 an/android_smoke.py _tmp_ci
          ls -la _tmp_ci
          test "$(md5sum _tmp_ci/s1.elf | cut -d' ' -f1)" = "c264f57b8c2415926555853b6782db31"
          test "$(md5sum _tmp_ci/s2.elf | cut -d' ' -f1)" = "25d79ddb76de6238e589349727e20341"
          test "$(md5sum _tmp_ci/s3.elf | cut -d' ' -f1)" = "8132f1d1363b15e4b2cab7d4a8bb05ae"
          echo "[OK] 样本 md5 冻结值全符"
      - name: 生成 AN-3 产物（β 段完成定义三项 · md5 冻结核验）
        run: |
          python3 an/androidstub.py _tmp_ci/sb_beta.bin --beta
          python3 an/androidpkg64.py _tmp_ci/sb_beta.bin _tmp_ci/jiqiA64an_beta.elf --beta
          python3 an/androidstub.py _tmp_ci/se4b.bin --e4 --beta
          python3 an/androidpkg64.py _tmp_ci/se4b.bin _tmp_ci/jiqiA64an_e4beta.elf --e4 --beta
          python3 an/beta_gen.py _tmp_ci
          ls -la _tmp_ci
          test "$(md5sum _tmp_ci/jiqiA64an_beta.elf | cut -d' ' -f1)" = "d4841bd52438e520e54a6f676a368f1d"
          test "$(md5sum _tmp_ci/jiqiA64an_e4beta.elf | cut -d' ' -f1)" = "540da91d6018e32556a98b4d6d42445d"
          echo "[OK] β 产物 md5 冻结值全符"
      - name: 启动 Redroid（arm64 Android 容器）并等待 boot
        run: |
          set -x
          uname -m
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || echo "(警告) modules-extra 未装成——继续尝试 modprobe"
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux || echo "(提示) ashmem_linux 不可用（新内核已由 memfd 取代·容忍）"
          lsmod | grep -E "binder|ashmem" || true
          docker run -d --name redroid --privileged -p 5555:5555 \
            redroid/redroid:14.0.0_64only-latest \
            androidboot.redroid_gpu_mode=guest
          sleep 10
          adb connect localhost:5555 || true
          # ★设备锁定（联调 #2 教训：5555＝emulator 标准端口 ⇒ adb 自动识别 emulator-5554
          #   ＋手动 connect 条目 ⇒ 双条目歧义「more than one device」——全部命令锁定单设备）
          export ANDROID_SERIAL=localhost:5555
          timeout 120 adb wait-for-device || true
          ok=0
          for i in $(seq 1 60); do
            b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "  [boot ${i}] sys.boot_completed=${b}"
            if [ "${b}" = "1" ]; then ok=1; break; fi
            sleep 5
          done
          adb devices
          echo "ABI=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          echo "SDK=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          if [ "${ok}" != "1" ]; then
            echo "== redroid 未完成 boot——容器日志尾部（诊断）=="
            docker logs --tail 80 redroid || true
          fi
      - name: 运行 AN 线判据
        # ★设备锁定（跨 step 环境变量不保留·此处显式锁定；check.sh 内另有自选兜底）
        run: |
          export ANDROID_SERIAL=localhost:5555
          bash an/check.sh
